name: FactBite Media Cleanup
on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated posts older than 90 days
        shell: bash
        run: |
          cutoff=$(date -u -d '90 days ago' +%Y-%m-%d)
          removed=0
          for d in posts/*; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            day=${name:0:10}
            if [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$day" < "$cutoff" ]]; then
              rm -rf "$d"
              removed=$((removed+1))
            fi
          done
          echo "Removed $removed post directories older than $cutoff"
      - name: Commit cleanup
        run: |
          git config user.name "factbite-bot"
          git config user.email "bot@factbite.local"
          git add -A posts/
          git diff --cached --quiet || git commit -m "Cleanup: remove generated posts older than 90 days"
          git push
