name: Daily FactBite Posts
on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 10 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 12 * * *"
      timezone: "Europe/Istanbul"
    - cron: "30 13 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 15 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 18 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 22 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
    inputs:
      category:
        description: "Category for a manual test run"
        required: false
        default: "general"
        type: choice
        options: [general, history, language, health, animals, tech, science, sports, news, culture, space]
permissions:
  contents: write
  issues: write
concurrency:
  group: factbite-daily-posts
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    outputs:
      quota_exhausted: ${{ steps.gemini.outputs.quota_exhausted || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pillow arabic_reshaper python-bidi edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Build or reuse today's FactBite Brain plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/smart_plan.py
      - name: Select slot
        id: slot
        run: python scripts/select_plan.py
      - name: Skip special-day slot when no special day exists
        if: ${{ steps.slot.outputs.is_special != 'true' && github.event.schedule == '30 13 * * *' }}
        run: echo "No special day today; nothing to publish at the special-day slot." && exit 0
      - name: Generate today's fact (Gemini API)
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATEGORY: ${{ steps.slot.outputs.category }}
          CONTENT_FORMAT: ${{ steps.slot.outputs.format }}
          SPECIAL_DAY: ${{ steps.slot.outputs.special }}
        run: python scripts/generate_content.py
      - name: Notify Gemini quota exhausted
        if: ${{ steps.gemini.outputs.quota_exhausted == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "⚠️ FactBite Gemini API kotası doldu\nBugünkü Gemini limiti/rate limitine ulaşıldı. Yeni içerik üretilemedi.\nKategori: ${{ steps.slot.outputs.category }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python scripts/notify_telegram.py
          exit 1
      - name: Stop if Gemini generation failed
        if: ${{ steps.gemini.outcome == 'failure' }}
        run: exit 1
      - name: Render five carousel slides (archive only)
        run: python scripts/render_v2.py
      - name: Build polished Reel media
        run: python scripts/build_reel.py
      - name: Build Story V2 media
        run: python scripts/build_story_v2.py
      - name: Remove media older than 14 days
        run: python scripts/cleanup_media.py
      - name: Commit generated media, plan and topic history
        run: |
          git config user.name "factbite-bot"
          git config user.email "bot@factbite.local"
          git add posts/ fact.json latest_post_dir.txt data/topic_history.json data/daily_plan.json
          git commit -m "Auto: FactBite Reel source ${{ steps.slot.outputs.category }} $(date -u +%F_%H%M)" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: Wait for generated Reel to become public
        id: reel_public
        if: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 10 * * *' || github.event.schedule == '17 18 * * *' || github.event.schedule == '17 22 * * *') }}
        continue-on-error: true
        run: |
          set -e
          POST_DIR=$(cat latest_post_dir.txt)
          URL="https://raw.githubusercontent.com/${{ github.repository }}/main/${POST_DIR}/factbite_reel.mp4"
          echo "Waiting for generated Reel asset: $URL"
          for i in $(seq 1 24); do
            CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL?cachebust=${{ github.run_id }}-$i")
            if [ "$CODE" = "200" ]; then
              echo "Generated Reel is publicly reachable."
              exit 0
            fi
            echo "Waiting for raw GitHub asset (HTTP $CODE)..."
            sleep 5
          done
          echo "Generated Reel asset is not publicly reachable."
          exit 1

      - name: Publish Reel to Instagram
        id: publish
        if: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 10 * * *' || github.event.schedule == '17 18 * * *' || github.event.schedule == '17 22 * * *') && steps.reel_public.outcome == 'success' }}
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          REEL_FILENAME: factbite_reel.mp4
        run: |
          set -o pipefail
          python scripts/publish_reel.py 2>&1 | tee /tmp/reel_publish.log

      - name: Telegram Reel result notification
        if: ${{ success() || steps.publish.outcome == 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: ${{ steps.publish.outcome == 'success' && format('✅ FactBite Reel başarıyla Instagram''da yayınlandı.\nKategori: {0}\nRun: https://github.com/{1}/actions/runs/{2}', steps.slot.outputs.category, github.repository, github.run_id) || steps.publish.outcome == 'failure' && format('🚨 FactBite Reel yayınlanamadı.\nAşama: Instagram yayınlama\nKategori: {0}\nRun: https://github.com/{1}/actions/runs/{2}\nDetay: Actions içindeki "Publish Reel to Instagram" adımına bak.', steps.slot.outputs.category, github.repository, github.run_id) || '🎬 FactBite içeriği hazırlandı. Bu saat Reel yayınlama saati değil; Reel yayınlama sonraki Reel slotunda yapılacak.' }}
        run: python scripts/notify_telegram.py

      - name: Fail workflow when Reel publish failed
        if: ${{ steps.publish.outcome == 'failure' }}
        run: |
          echo "Instagram Reel publish failed. Exact command output:"
          cat /tmp/reel_publish.log || true
          exit 1

  notify-failure:
    if: ${{ needs.post.result == 'failure' && needs.post.outputs.quota_exhausted != 'true' }}
    needs: [post]
    runs-on: ubuntu-latest
    steps:
      - name: Create failure notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: `🚨 FactBite başarısız — ${new Date().toISOString().slice(0, 10)}`, body: `Workflow başarısız oldu.\n\nRun: ${runUrl}` });
      - name: Telegram failure notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "🚨 FactBite başarısız\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python scripts/notify_telegram.py
