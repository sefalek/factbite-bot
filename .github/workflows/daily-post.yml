name: Daily FactBite Posts

on:
  schedule:
    # All times are UTC. Turkey is UTC+3 year-round (no DST).
    # Staggered minutes reduce the chance of GitHub Actions schedule delays.
    - cron: "3 5 * * *"    # 08:03 TR - Tarih & Kultur
    - cron: "7 7 * * *"    # 10:07 TR - Dil & Kelime kokenleri
    - cron: "3 9 * * *"    # 12:03 TR - Insan vucudu & Saglik
    - cron: "7 12 * * *"   # 15:07 TR - Hayvanlar & Doga
    - cron: "3 15 * * *"   # 18:03 TR - Teknoloji & Icatlar
    - cron: "7 19 * * *"   # 22:07 TR - Bilim & Uzay
  workflow_dispatch:
    inputs:
      category:
        description: "Category for a manual test run"
        required: false
        default: "general"
        type: choice
        options:
          - general
          - history
          - language
          - health
          - animals
          - tech
          - science

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow arabic_reshaper python-bidi

      - name: Determine category
        id: cat
        run: |
          case "${{ github.event.schedule }}" in
            "3 5 * * *")  echo "category=history"  >> "$GITHUB_OUTPUT" ;;
            "7 7 * * *")  echo "category=language" >> "$GITHUB_OUTPUT" ;;
            "3 9 * * *")  echo "category=health"   >> "$GITHUB_OUTPUT" ;;
            "7 12 * * *") echo "category=animals"  >> "$GITHUB_OUTPUT" ;;
            "3 15 * * *") echo "category=tech"     >> "$GITHUB_OUTPUT" ;;
            "7 19 * * *") echo "category=science"  >> "$GITHUB_OUTPUT" ;;
            *) echo "category=${{ inputs.category || 'general' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Generate today's fact (Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATEGORY: ${{ steps.cat.outputs.category }}
        run: python scripts/generate_content.py

      - name: Render carousel slides
        run: python scripts/render_slides.py

      - name: Commit generated images
        run: |
          git config user.name "factbite-bot"
          git config user.email "bot@factbite.local"
          git add posts/ fact.json latest_post_dir.txt
          git commit -m "Auto: ${{ steps.cat.outputs.category }} post $(date -u +%F_%H%M)" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publish_instagram.py

  notify-failure:
    if: ${{ failure() }}
    needs: [post]
    runs-on: ubuntu-latest
    steps:
      - name: Create failure notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const category = '${{ needs.post.result }}' === 'failure' ? 'scheduled/manual' : 'unknown';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 FactBite otomasyonu başarısız — ${new Date().toISOString().slice(0, 10)}`;
            const body = `@${context.actor} FactBite otomasyonu başarısız oldu.\n\n` +
              `- Workflow: Daily FactBite Posts\n` +
              `- Run: ${runUrl}\n` +
              `- Sonuç: ${category}\n\n` +
              `Lütfen Actions logunu kontrol et.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
