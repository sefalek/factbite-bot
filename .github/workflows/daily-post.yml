name: Daily FactBite Posts
on:
  schedule:
    - cron: "3 5 * * *"
    - cron: "7 7 * * *"
    - cron: "3 9 * * *"
    - cron: "7 12 * * *"
    - cron: "3 15 * * *"
    - cron: "7 19 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Category for a manual test run"
        required: false
        default: "general"
        type: choice
        options: [general, history, language, health, animals, tech, science]
permissions:
  contents: write
  issues: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pillow arabic_reshaper python-bidi
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Determine category
        id: cat
        run: |
          case "${{ github.event.schedule }}" in
            "3 5 * * *")  echo "category=history"  >> "$GITHUB_OUTPUT" ;;
            "7 7 * * *")  echo "category=language" >> "$GITHUB_OUTPUT" ;;
            "3 9 * * *")  echo "category=health"   >> "$GITHUB_OUTPUT" ;;
            "7 12 * * *") echo "category=animals"  >> "$GITHUB_OUTPUT" ;;
            "3 15 * * *") echo "category=tech"     >> "$GITHUB_OUTPUT" ;;
            "7 19 * * *") echo "category=science"  >> "$GITHUB_OUTPUT" ;;
            *) echo "category=${{ inputs.category || 'general' }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Generate today's fact (Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATEGORY: ${{ steps.cat.outputs.category }}
        run: python scripts/generate_content.py
      - name: Render five carousel slides
        run: python scripts/render_v2.py
      - name: Build Reel
        run: python scripts/build_reel.py
      - name: Commit generated media and topic history
        run: |
          git config user.name "factbite-bot"
          git config user.email "bot@factbite.local"
          git add posts/ fact.json latest_post_dir.txt data/topic_history.json
          git commit -m "Auto: ${{ steps.cat.outputs.category }} post $(date -u +%F_%H%M)" || echo "nothing to commit"
          git pull --rebase
          git push
      - name: Publish Instagram carousel, Story and Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publish_v2.py
      - name: Publish Facebook Page post
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/publish_facebook.py
      - name: Telegram success notification
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "✅ FactBite V2 yayınlandı\nKategori: ${{ steps.cat.outputs.category }}\nInstagram: Carousel + Story + Reel\nFacebook: Page paylaşımı denendi"
        run: python scripts/notify_telegram.py
  notify-failure:
    if: ${{ needs.post.result == 'failure' }}
    needs: [post]
    runs-on: ubuntu-latest
    steps:
      - name: Create failure notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: `🚨 FactBite V2 başarısız — ${new Date().toISOString().slice(0, 10)}`, body: `Workflow başarısız oldu.\n\nRun: ${runUrl}` });
      - name: Telegram failure notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "🚨 FactBite V2 başarısız\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python scripts/notify_telegram.py
