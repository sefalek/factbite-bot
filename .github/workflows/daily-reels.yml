name: FactBite Reels
on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 19 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 23 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
    inputs:
      expected_category:
        description: "Category of the post whose Reel should be published"
        required: false
        default: "history"
        type: choice
        options: [history, tech, science]
permissions:
  contents: read
concurrency:
  group: factbite-reels
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Determine Reel slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "17 9 * * *")  echo "category=history" >> "$GITHUB_OUTPUT" ;;
            "17 19 * * *") echo "category=tech"    >> "$GITHUB_OUTPUT" ;;
            "17 23 * * *") echo "category=science" >> "$GITHUB_OUTPUT" ;;
            *) echo "category=${{ inputs.expected_category || 'history' }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Publish delayed Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          EXPECTED_CATEGORY: ${{ steps.slot.outputs.category }}
        run: python scripts/publish_reel.py
      - name: Telegram Reel success notification
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "🎬 FactBite Reel yayınlandı\nKategori: ${{ steps.slot.outputs.category }}\nInstagram: Reel"
        run: python scripts/notify_telegram.py
      - name: Telegram Reel failure notification
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "🚨 FactBite Reel yayınlanamadı\nBeklenen kategori: ${{ steps.slot.outputs.category }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python scripts/notify_telegram.py
