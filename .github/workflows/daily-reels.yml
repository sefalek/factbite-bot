name: FactBite Reels
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factbite-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Reel dependencies
        run: |
          pip install pillow arabic_reshaper python-bidi edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Build premium Reel
        run: python scripts/build_reel.py

      - name: Give Reel a unique public asset name
        run: |
          set -e
          POST_DIR=$(cat latest_post_dir.txt)
          REEL_FILE="factbite_reel_${GITHUB_RUN_ID}.mp4"
          test -f "$POST_DIR/factbite_reel.mp4"
          cp "$POST_DIR/factbite_reel.mp4" "$POST_DIR/$REEL_FILE"
          echo "REEL_FILENAME=$REEL_FILE" >> "$GITHUB_ENV"
          echo "Unique Reel asset: $POST_DIR/$REEL_FILE"

      - name: Publish generated Reel asset to repository
        run: |
          set -e
          POST_DIR=$(cat latest_post_dir.txt)
          test -f "$POST_DIR/$REEL_FILENAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$POST_DIR/$REEL_FILENAME"
          git commit -m "Publish generated FactBite Reel asset $REEL_FILENAME"
          git push origin HEAD:main

      - name: Wait for public Reel URL
        run: |
          set -e
          POST_DIR=$(cat latest_post_dir.txt)
          URL="https://raw.githubusercontent.com/${{ github.repository }}/main/${POST_DIR}/${REEL_FILENAME}"
          for i in $(seq 1 12); do
            CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL?cachebust=$(date +%s)-$i")
            if [ "$CODE" = "200" ]; then
              echo "Reel asset is publicly reachable: $URL"
              exit 0
            fi
            echo "Waiting for raw GitHub asset (HTTP $CODE)..."
            sleep 5
          done
          echo "Generated Reel asset is not publicly reachable."
          exit 1

      - name: Publish Reel to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          REEL_FILENAME: ${{ env.REEL_FILENAME }}
        run: |
          set -o pipefail
          python scripts/publish_reel.py 2>&1 | tee /tmp/reel_publish.log

      - name: Fail workflow when Instagram publish failed
        if: ${{ failure() }}
        run: |
          if [ -f /tmp/reel_publish.log ]; then
            echo "--- Instagram publish output ---"
            cat /tmp/reel_publish.log
          fi
          exit 1

  telegram:
    if: ${{ always() }}
    needs: [reel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Send Reel result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: ${{ needs.reel.result == 'success' && format('FactBite Reel basariyla Instagramda yayinlandi. Facebook capraz paylasimi Meta ayarlarina baglidir.\n\nRun: https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) || format('FactBite Reel yayinlanamadi.\n\nAsama: Reel uretimi veya Instagram yayinlama\nDurum: {0}\nRun: https://github.com/{1}/actions/runs/{2}', needs.reel.result, github.repository, github.run_id) }}
        run: python scripts/notify_telegram.py

      - name: Verify Telegram configuration
        if: ${{ failure() }}
        run: echo "Telegram bildirimi gonderilemedi. TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret degerlerini ve Telegram bot erisimini kontrol et."
