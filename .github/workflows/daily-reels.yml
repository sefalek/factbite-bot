name: FactBite Reels

on:
  schedule:
    - cron: "12 8 * * *"
      timezone: "Europe/Istanbul"
    - cron: "15 9 * * *"
      timezone: "Europe/Istanbul"
    - cron: "13 11 * * *"
      timezone: "Europe/Istanbul"
    - cron: "20 14 * * *"
      timezone: "Europe/Istanbul"
    - cron: "3 16 * * *"
      timezone: "Europe/Istanbul"
    - cron: "0 18 * * *"
      timezone: "Europe/Istanbul"
    - cron: "5 20 * * *"
      timezone: "Europe/Istanbul"
    - cron: "0 22 * * *"
      timezone: "Europe/Istanbul"
    - cron: "40 23 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factbite-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Reel dependencies
        run: |
          pip install pillow arabic_reshaper python-bidi edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Build premium Reel
        run: python scripts/build_reel.py

      - name: Give Reel a unique public asset name
        run: |
          set -e
          POST_DIR=$(cat latest_post_dir.txt)
          REEL_FILE="factbite_reel_${GITHUB_RUN_ID}.mp4"
          test -f "$POST_DIR/factbite_reel.mp4"
          cp "$POST_DIR/factbite_reel.mp4" "$POST_DIR/$REEL_FILE"
          echo "POST_DIR=$POST_DIR" >> "$GITHUB_ENV"
          echo "REEL_FILENAME=$REEL_FILE" >> "$GITHUB_ENV"

      - name: Publish generated Reel asset to repository
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$POST_DIR/$REEL_FILENAME"
          git commit -m "Publish generated FactBite Reel asset $REEL_FILENAME"
          git push origin HEAD:main

      - name: Wait for public Reel URL
        run: |
          set -e
          URL="https://raw.githubusercontent.com/${{ github.repository }}/main/${POST_DIR}/${REEL_FILENAME}"
          for i in $(seq 1 12); do
            CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL?cachebust=${{ github.run_id }}-$i")
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Publish Reel to Instagram
        id: publish
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          REEL_FILENAME: ${{ env.REEL_FILENAME }}
        run: |
          set -o pipefail
          python scripts/publish_reel.py 2>&1 | tee /tmp/reel_publish.log

      - name: Send Telegram result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "FactBite Reel sonucu: Instagram=${{ steps.publish.outcome }} | Run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python scripts/notify_telegram.py

      - name: Fail if Instagram publish failed
        if: steps.publish.outcome != 'success'
        run: |
          echo "Instagram Reel publish failed."
          if [ -f /tmp/reel_publish.log ]; then cat /tmp/reel_publish.log; fi
          exit 1
