name: FactBite Reels
on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 19 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 23 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factbite-reels
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Publish delayed Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: python scripts/publish_reel.py
      - name: Telegram Reel success notification
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "🎬 FactBite Reel yayınlandı\nKategori: Brain'in seçtiği gerçek kategori\nInstagram: Reel"
        run: python scripts/notify_telegram.py
      - name: Telegram Reel failure notification
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "🚨 FactBite Reel yayınlanamadı\nBrain seçimine göre Reel üretimi/yayını başarısız oldu\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python scripts/notify_telegram.py
