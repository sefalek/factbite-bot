name: FactBite Reels
on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 19 * * *"
      timezone: "Europe/Istanbul"
    - cron: "17 23 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factbite-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Reel dependencies
        run: |
          pip install pillow arabic_reshaper python-bidi edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Build premium Reel
        run: python scripts/build_reel.py

      - name: Publish generated Reel asset to repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          POST_DIR=$(cat latest_post_dir.txt)
          test -f "$POST_DIR/factbite_reel.mp4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$POST_DIR/factbite_reel.mp4"
          if git diff --cached --quiet; then
            echo "No new Reel asset to commit."
          else
            git commit -m "Publish generated FactBite Reel asset"
            git push origin HEAD:main
          fi

      - name: Wait for public Reel URL
        run: |
          set -e
          POST_DIR=$(cat latest_post_dir.txt)
          URL="https://raw.githubusercontent.com/${{ github.repository }}/main/${POST_DIR}/factbite_reel.mp4"
          for i in $(seq 1 12); do
            CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL?cachebust=$(date +%s)-$i")
            if [ "$CODE" = "200" ]; then
              echo "Reel asset is publicly reachable."
              exit 0
            fi
            echo "Waiting for raw GitHub asset (HTTP $CODE)..."
            sleep 5
          done
          echo "Generated Reel asset is not publicly reachable."
          exit 1

      - name: Publish Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: python scripts/publish_reel.py

      - name: Telegram Reel success notification
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "🎬 FactBite Reel yayınlandı\nKategori: Brain'in seçtiği gerçek kategori\nInstagram: Reel"
        run: python scripts/notify_telegram.py

      - name: Telegram Reel failure notification
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: "🚨 FactBite Reel yayınlanamadı\nBrain seçimine göre Reel üretimi/yayını başarısız oldu\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python scripts/notify_telegram.py
